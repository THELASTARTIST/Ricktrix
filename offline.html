<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — RICKTRIX</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFC22E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RICKTRIX">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{ --ink:#16130F; --paper:#F7F2E1; --paper-2:#ECE4CC; --yellow:#FFC22E; --line:rgba(22,19,15,.14); --ink-60:rgba(22,19,15,.6); }
:root[data-theme="dark"]{ --ink:#F5EFDD; --paper:#0F0D0A; --paper-2:#1C1712; --yellow:#FFCB4D; --line:rgba(245,239,221,.12); --ink-60:rgba(245,239,221,.6); }
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.card{max-width:440px;width:100%;text-align:center;}
.badge{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:var(--yellow);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;}
h1{font-family:'Space Grotesk',serif;margin:0 0 10px;font-size:26px;}
p{color:var(--ink-60);line-height:1.6;margin:0 0 10px;font-size:15px;}
.retry{margin-top:26px;background:var(--yellow);color:#16130F;border:2px solid var(--ink);
  border-radius:10px;padding:13px 26px;font:700 15px 'Space Grotesk',sans-serif;cursor:pointer;}
.retry:active{transform:translateY(1px);}
.note{margin-top:22px;font-size:13px;}
.note code{background:var(--paper-2);padding:2px 6px;border-radius:5px;font-size:12px;}
</style>
</head>
<body>
<div class="card">
  <div class="badge">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="#16130F"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>That page hasn't been saved to this device yet. Route search, fares and
     your saved routes all still work without a connection — they're stored on
     your phone.</p>
  <button class="retry" onclick="location.reload()">Try again</button>
  <p class="note">Route data lives in <code>autofare.js</code> and is cached the
     first time you open the app.</p>
</div>
<script src="pwa.js"></script>
</body>
</html>
