<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live tracking — RICKTRIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
try{
  var t = localStorage.getItem('ricktrix-theme') || ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
}catch(e){}
</script>
<style>
:root{
  --ink:#16130F; --paper:#F7F2E1; --paper-2:#ECE4CC; --paper-3:#DED3AE; --yellow:#FFC22E; --green:#1F9D63; --rust:#C1442D;
  --line: rgba(22,19,15,.14); --ink-60: rgba(22,19,15,.6);
}
:root[data-theme="dark"]{ --ink:#F5EFDD; --paper:#0F0D0A; --paper-2:#1C1712; --paper-3:#26201A; --yellow:#FFCB4D; --green:#2FBE7A; --rust:#E2604A; --line: rgba(245,239,221,.12); --ink-60: rgba(245,239,221,.6); }
*{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:1160px; margin:0 auto; padding:0 20px;}
header{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--paper); border-bottom:1px solid var(--line);}
.headbar{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; max-width:1160px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px;}
.badge{width:36px; height:36px; border-radius:50%; background:var(--yellow); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:14px;}
.brand-name{font-family:'Space Grotesk'; font-weight:700; font-size:18px;}
.icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer;}

main{padding:28px 0 44px;}
.status{background:var(--green); color:#fff; border-radius:12px; padding:18px 22px; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:14px; flex-wrap:wrap;}
.status .l{display:flex; align-items:center; gap:12px;}
.status .l svg{opacity:.9;}
.status h2{margin:0; font-size:19px;}
.status p{margin:2px 0 0; font-size:13px; opacity:.9;}
.status button{background:#fff; color:var(--green); border:none; padding:10px 18px; border-radius:8px; font-weight:700; font-family:'Space Grotesk'; cursor:pointer;}
.status.off{background:#6b6459;}
.status.off button{color:#6b6459;}

.grid{display:grid; grid-template-columns:1.65fr 1fr; gap:18px;}
@media(max-width:920px){ .grid{grid-template-columns:1fr;} }
.panel{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:20px;}
.panel h3{margin:0 0 14px; font-size:15.5px; display:flex; align-items:center; gap:8px;}

/* schematic map */
.map-frame{border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--paper-2); position:relative;}
.map-frame svg{display:block; width:100%; height:auto;}
#liveRoute{animation:march 1s linear infinite;}
@keyframes march{to{stroke-dashoffset:-15;}}
.map-toolbar{display:flex; gap:10px; margin-top:12px;}
.map-toolbar button{flex:1; padding:12px; border-radius:8px; border:1px solid var(--line); background:none; color:var(--ink); font-weight:600; font-size:13.5px; cursor:pointer;}
.map-toolbar button:hover{border-color:var(--yellow); background:var(--paper-2);}

.info-row{display:flex; gap:12px; margin-bottom:14px; align-items:flex-start;}
.info-row svg{margin-top:2px; color:var(--rust); flex-shrink:0;}
.info-row .lbl{font-size:11.5px; color:var(--ink-60); text-transform:uppercase; letter-spacing:.03em;}
.info-row .val{font-weight:600; font-size:14.5px;}
.mono{font-family:monospace; font-size:12.5px;}

.rick-item{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
.rick-item:last-child{border:none;}
.dot-status{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.dot-status.active{background:var(--green); box-shadow:0 0 0 3px rgba(31,157,99,.2);}
.dot-status.idle{background:var(--yellow); box-shadow:0 0 0 3px rgba(255,194,46,.25);}
.rick-info{flex:1; min-width:0;}
.rick-info .name{font-weight:600; font-size:13.5px;}
.rick-info .route{font-size:12px; color:var(--ink-60);}
.rick-dist{font-size:12.5px; font-weight:600; color:var(--ink-60); white-space:nowrap;}

.qa button{width:100%; text-align:left; padding:11px 8px; border:none; background:none; color:var(--ink); font-size:13.5px; display:flex; align-items:center; gap:10px; cursor:pointer; border-radius:6px;}
.qa button:hover{background:var(--paper-2);}
</style>
</head>
<body>
<header>
  <div class="headbar">
    <a href="index.html" class="brand"><div class="badge"><svg viewBox="0 0 24 24" width="20" height="20" fill="#16130F"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg></div><div class="brand-name">RICKTRIX</div></a>
    <nav class="page-nav" aria-label="Main navigation">
      <a href="index.html">Home</a><a href="all_routes.html">Routes</a><a href="tracking.html" aria-current="page">Tracking</a><a href="community.html">Community</a><a href="about.html">About</a><a href="saved_routes.html">Saved</a>
    </nav>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
      <svg id="sunIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4 6.4l-.7-.7M6.3 6.3l-.7-.7m12.8 0l-.7.7M6.3 17.7l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M20.4 15.4A9 9 0 018.6 3.6 9 9 0 0012 21a9 9 0 008.4-5.6z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="status" id="statusBanner">
    <div class="l">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M17.7 16.7L13.4 21a2 2 0 01-2.8 0L6.4 16.7a8 8 0 1111.3 0z"/></svg>
      <div><h2>Live tracking active</h2><p>Nearby route positions update automatically</p></div>
    </div>
    <button id="stopBtn">Stop tracking</button>
  </div>

  <div class="grid">
    <div class="panel">
      <h3>Live map view</h3>
      <div class="map-frame">
        <svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" id="mapSvg">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M40 0H0V40" fill="none" stroke="var(--line)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="640" height="420" fill="var(--paper-2)"/>
          <rect width="640" height="420" fill="url(#grid)"/>
          <path d="M-10 305 Q 200 255 340 275 Q 480 295 650 240" stroke="var(--line)" stroke-width="26" fill="none" stroke-linecap="round"/>
          <path d="M-10 305 Q 200 255 340 275 Q 480 295 650 240" stroke="var(--paper-3)" stroke-width="20" fill="none" stroke-linecap="round"/>
          <g stroke="var(--line)" stroke-width="10" fill="none" stroke-linecap="round">
            <path d="M60 350 L 270 130 L 470 210 L 600 70"/>
            <path d="M90 60 L 270 130 L 330 335 L 560 385"/>
          </g>
          <!-- live route, highlighted -->
          <path id="liveRoute" d="M90 60 L 270 130 L 330 335" stroke="var(--rust)" stroke-width="3.5" fill="none" stroke-dasharray="1 14" stroke-linecap="round"/>
          <g id="areaLabels" font-family="Work Sans" font-size="11" font-weight="600" fill="var(--ink)" opacity="0.68"></g>
          <g id="autoMarkers"></g>
          <g id="movingRick">
            <circle r="10" fill="var(--rust)" opacity="0.2"/>
            <g transform="translate(-7,-7) scale(0.6)">
              <path fill="var(--paper)" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
            </g>
            <animateMotion dur="7s" repeatCount="indefinite" path="M90 60 L 270 130 L 330 335"/>
          </g>
          <g id="userMarker"></g>
        </svg>
      </div>
      <div class="map-toolbar">
        <button id="centerBtn">Center on me</button>
        <button id="routeBtn">View full route</button>
        <button id="shareBtn">Share location</button>
      </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:16px;">
        <h3>Current location</h3>
        <div class="info-row">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.7 16.7L13.4 21a2 2 0 01-2.8 0L6.4 16.7a8 8 0 1111.3 0z"/></svg>
          <div><div class="lbl">Area</div><div class="val" id="currentArea">Detecting…</div></div>
        </div>
        <div class="info-row">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>
          <div><div class="lbl">Last updated</div><div class="val" id="lastUpdate">—</div></div>
        </div>
        <div class="info-row">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5.4-2.7a1 1 0 01-.6-1V5.6a1 1 0 011.4-.9L9 7m0 13l6-3m-6 3V7m6 10l4.6 2.3a1 1 0 001.4-.9V7.6a1 1 0 00-.6-.9L15 4m0 13V4"/></svg>
          <div><div class="lbl">Coordinates</div><div class="val mono" id="coords">—°, —°</div></div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:16px;">
        <h3>Nearby RickTrix</h3>
        <div id="nearbyList"></div>
      </div>

      <div class="panel">
        <h3>Quick actions</h3>
        <div class="qa">
          <button onclick="shareLoc()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.7 13.3a3 3 0 100-2.7m0 2.7l6.6 3.3m-6.6-6l6.6-3.3m0 0a3 3 0 105.4-2.7 3 3 0 00-5.4 2.7zm0 9.3a3 3 0 105.4 2.7 3 3 0 00-5.4-2.7z"/></svg>Share with friends</button>
          <button onclick="alert('ETA alerts — coming soon.')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>Set ETA alert</button>
          <button onclick="alert('Trip history — coming soon.')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2z"/></svg>View trip history</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const areas = [
  {name:'Howrah', x:90, y:330}, {name:'Esplanade', x:260, y:120}, {name:'Salt Lake', x:460, y:200},
  {name:'Ultadanga', x:600, y:60}, {name:'Park Circus', x:320, y:330}, {name:'Garia', x:560, y:380}
];
document.getElementById('areaLabels').innerHTML = areas.map(a=>`<text x="${a.x+8}" y="${a.y-6}">${a.name}</text>`).join('');

const rickshaws = [
  {id:1, driver:'Rajesh Kumar', dist:0.2, status:'active', route:'Howrah → Salt Lake', x:230, y:160},
  {id:2, driver:'Amit Singh', dist:0.5, status:'active', route:'Park Circus → Garia', x:400, y:300},
  {id:3, driver:'Suresh Pal', dist:0.8, status:'idle', route:'Available', x:500, y:150},
  {id:4, driver:'Dinesh Roy', dist:1.2, status:'active', route:'Jadavpur → Tollygunge', x:340, y:250},
];

function paintMarkers(){
  document.getElementById('autoMarkers').innerHTML = rickshaws.map((r,i)=>`
    <g transform="translate(${r.x},${r.y})">
      <circle r="11" fill="${r.status==='active' ? 'var(--green)' : 'var(--yellow)'}" opacity="0.22">
        <animate attributeName="r" values="11;17;11" dur="2.4s" begin="${i*0.3}s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;0;0.22" dur="2.4s" begin="${i*0.3}s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="${r.status==='active' ? 'var(--green)' : 'var(--yellow)'}" stroke="var(--paper)" stroke-width="2"/>
      <g transform="translate(-6,-6) scale(0.5)">
        <path fill="var(--paper)" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
      </g>
    </g>`).join('');
}
paintMarkers();
document.getElementById('userMarker').innerHTML = `
  <g transform="translate(260,200)">
    <circle r="15" fill="var(--rust)" opacity="0.18">
      <animate attributeName="r" values="15;22;15" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0;0.22" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="var(--rust)" stroke="var(--paper)" stroke-width="2.5"/>
  </g>`;

function displayNearby(){
  document.getElementById('nearbyList').innerHTML = rickshaws.map(r=>`
    <div class="rick-item">
      <span class="dot-status ${r.status}"></span>
      <div class="rick-info"><div class="name">${r.driver}</div><div class="route">${r.route}</div></div>
      <div class="rick-dist">${r.dist.toFixed(1)} km</div>
    </div>`).join('');
}
displayNearby();

setInterval(()=>{
  rickshaws.forEach(r=>{ r.dist = Math.max(0.1, r.dist + (Math.random()-0.5)*0.15); });
  displayNearby();
}, 4000);

function updateClock(){
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
updateClock();
setInterval(updateClock, 30000);

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    pos=>{
      document.getElementById('coords').textContent = `${pos.coords.latitude.toFixed(4)}°, ${pos.coords.longitude.toFixed(4)}°`;
      document.getElementById('currentArea').textContent = 'Near your current position';
    },
    ()=>{ document.getElementById('currentArea').textContent = 'Location unavailable'; },
    {timeout:5000}
  );
} else {
  document.getElementById('currentArea').textContent = 'Location unavailable';
}

document.getElementById('stopBtn').addEventListener('click', ()=>{
  const b = document.getElementById('statusBanner');
  b.classList.add('off');
  b.innerHTML = `<div class="l"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18.4 18.4A9 9 0 015.6 5.6m12.8 12.8A9 9 0 015.6 5.6m12.8 12.8L5.6 5.6"/></svg><div><h2>Tracking stopped</h2><p>Location tracking has been disabled</p></div></div><button onclick="location.reload()">Restart</button>`;
});
document.getElementById('centerBtn').addEventListener('click', ()=>{ document.getElementById('mapSvg').scrollIntoView({behavior:'smooth', block:'center'}); });
document.getElementById('routeBtn').addEventListener('click', ()=>{ alert('Full route view — coming soon.'); });
function shareLoc(){
  const txt = document.getElementById('coords').textContent;
  if(navigator.share){ navigator.share({title:'My RICKTRIX location', text:`Track my ride — currently at ${txt}`}).catch(()=>{}); }
  else { alert('Share: ' + txt); }
}
document.getElementById('shareBtn').addEventListener('click', shareLoc);

function syncThemeIcon(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('sunIcon').style.display = isDark ? 'none' : '';
  document.getElementById('moonIcon').style.display = isDark ? '' : 'none';
}
syncThemeIcon();
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', cur);
  try{ localStorage.setItem('ricktrix-theme', cur); }catch(e){}
  syncThemeIcon();
});
</script>
</body>
</html>
